name: gubern_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  cryptography: ^2.9.0

flutter:
  uses-material-design: true

  # Fira Sans and Fira Code, bundled (SIL OFL, licenses beside the files):
  # the same type as the dashboard, and no runtime font downloads.
  fonts:
    - family: FiraSans
      fonts:
        - asset: assets/fonts/FiraSans-Regular.ttf
        - asset: assets/fonts/FiraSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/FiraSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/FiraSans-Bold.ttf
          weight: 700
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
        - asset: assets/fonts/FiraCode-Medium.ttf
          weight: 500
